[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "orbit-payments-razorpay"
version = "0.1.0a1"
description = "Razorpay Orders adapter for the Orbit Payments capability."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "orbit-payments>=0.1.0a1,<0.2",
  # Razorpay 2.0 replaces pkg_resources, removed from current setuptools releases.
  "razorpay>=2,<3",
  "requests>=2.32,<3",
]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Typing :: Typed"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.8,<1", "mypy>=1.13,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/orbit_payments_razorpay"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["orbit_payments_razorpay"]

[[tool.mypy.overrides]]
module = ["razorpay", "razorpay.*"]
ignore_missing_imports = true
